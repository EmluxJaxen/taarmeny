<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Wine glass bowl -->
  <path d="M20 12 Q20 38 40 44 Q60 38 60 12 Z" stroke="#2C2A28" stroke-width="2" stroke-linejoin="round" fill="none"/>
  <!-- Liquid fill  about half full -->
  <path d="M24 28 Q25 40 40 44 Q55 40 56 28 Z" fill="#2C2A28" fill-opacity="0.09"/>
  <!-- Stem -->
  <line x1="40" y1="44" x2="40" y2="64" stroke="#2C2A28" stroke-width="2" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="27" y1="64" x2="53" y2="64" stroke="#2C2A28" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs (sides of bowl going to stem) -->
  <path d="M34 43 Q36 47 40 48 Q44 47 46 43" stroke="#2C2A28" stroke-width="1.5" fill="none"/>
</svg>
